[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tap-backend"
version = "0.1.0"
description = "tap (Track All Packs) backend - self-hosted multi-carrier package tracking"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "asyncpg>=0.30,<1.0",
  "alembic>=1.14,<2.0",
  "pydantic[email]>=2.9,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "pyjwt>=2.9,<3.0",
  "bcrypt>=4.1,<6.0",
  "cryptography>=43.0",
  "celery[redis]>=5.4,<6.0",
  "redis>=5.1,<6.0",
  "httpx>=0.27,<1.0",
  "beautifulsoup4>=4.12,<5.0",
  "lxml>=5.3",
  "pyyaml>=6.0",
  "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.8,<1.0",
  "mypy>=1.13,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "pytest-cov>=6.0,<7.0",
  "respx>=0.21,<1.0",
  "types-pyyaml",
  "pip-audit>=2.7,<3.0",
  "bandit>=1.7,<2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
  "E", "F", "W",   # pycodestyle / pyflakes
  "I",              # isort
  "UP",             # pyupgrade
  "B",              # bugbear
  "C4",             # comprehensions
  "SIM",            # simplify
  "ASYNC",          # async pitfalls
  "RUF",
]
ignore = ["B008"]  # FastAPI Depends() in defaults is intentional

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["celery.*", "bs4.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
  "live: hits real third-party providers, skipped by default",
]
addopts = "-m 'not live'"

[tool.coverage.run]
source = ["app"]
omit = ["app/seed/*"]

[tool.bandit]
exclude_dirs = ["tests", "alembic"]
skips = ["B101"]  # assert is used for post-validation type narrowing, not runtime enforcement
